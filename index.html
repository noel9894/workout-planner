<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" data-theme="light">
    <section class="top-controls" aria-label="Planner controls">
      <div class="control-group">
        <label for="person-selector">Person</label>
        <select id="person-selector" class="control" data-person-selector></select>
      </div>
      <div class="control-group">
        <label for="day-selector">Day</label>
        <select id="day-selector" class="control" data-day-selector></select>
      </div>
      <div class="control-group">
        <label for="theme-selector">Theme</label>
        <select id="theme-selector" class="control" data-theme-selector>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </section>

    <section id="plan-content" class="plan-card content-swap" data-plan-content aria-live="polite"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
